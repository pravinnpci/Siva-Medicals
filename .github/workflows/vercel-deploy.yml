name: Deploy Siva Medicals to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        run: vercel --prod --yes --token=${{ secrets.SIVA_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.SIVA_VERCEL_ORG_ID || secrets.VERCEL_ORG_ID || 'team_3hlRASIx1p3qCFTRNKRJ2wgu' }}
          VERCEL_PROJECT_ID: ${{ secrets.SIVA_VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID || 'prj_jF7F02TIrbzZD8zNfezoEpPtFGQa' }}