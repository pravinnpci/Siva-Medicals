name: Deploy Siva Medicals to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        run: vercel deploy --prod --yes --name=siva-medicals
        env:
          VERCEL_TOKEN: ${{ secrets.SIVA_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
          SIVA_DATABASE_URL: ${{ secrets.SIVA_DATABASE_URL || 'postgresql://postgres.vdccpnmlnppqdxgdhuok:siva-medicals01@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres' }}
          SIVA_SUPABASE_URL: ${{ secrets.SIVA_SUPABASE_URL || 'https://vdccpnmlnppqdxgdhuok.supabase.co' }}
          SIVA_SUPABASE_ANON_KEY: ${{ secrets.SIVA_SUPABASE_ANON_KEY || 'sb_publishable_d8eFggqr9eQ3aYPIhyZQxA_DxbgPpI9' }}
          SIVA_SESSION_SECRET: ${{ secrets.SIVA_SESSION_SECRET || '18b0a71548b94988df6e94f6550af7a82eb149d50514ebca22a4db807e0e21db' }}
          SIVA_COMPANY_EMAIL: ${{ secrets.SIVA_COMPANY_EMAIL || 'sapravin46@gmail.com' }}
          SIVA_EMAILJS_SERVICE_ID: ${{ secrets.SIVA_EMAILJS_SERVICE_ID || 'sivamedical' }}
          SIVA_EMAILJS_TEMPLATE_ID: ${{ secrets.SIVA_EMAILJS_TEMPLATE_ID || 'template_2fzsb0d' }}
          SIVA_EMAILJS_PUBLIC_KEY: ${{ secrets.SIVA_EMAILJS_PUBLIC_KEY || 'cWmO8pjToTEkzUc5Z' }}
          SIVA_WEBSITE_WHATSAPP_NUMBER: ${{ secrets.SIVA_WEBSITE_WHATSAPP_NUMBER || '9952930484' }}