name: Deploy Siva Medicals to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        run: vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.SIVA_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.SIVA_VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.SIVA_VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
          SIVA_DATABASE_URL: ${{ secrets.SIVA_DATABASE_URL }}
          SIVA_SUPABASE_URL: ${{ secrets.SIVA_SUPABASE_URL }}
          SIVA_SUPABASE_ANON_KEY: ${{ secrets.SIVA_SUPABASE_ANON_KEY }}
          SIVA_SESSION_SECRET: ${{ secrets.SIVA_SESSION_SECRET }}
          SIVA_COMPANY_EMAIL: ${{ secrets.SIVA_COMPANY_EMAIL }}
          SIVA_EMAILJS_SERVICE_ID: ${{ secrets.SIVA_EMAILJS_SERVICE_ID }}
          SIVA_EMAILJS_TEMPLATE_ID: ${{ secrets.SIVA_EMAILJS_TEMPLATE_ID }}
          SIVA_EMAILJS_PUBLIC_KEY: ${{ secrets.SIVA_EMAILJS_PUBLIC_KEY }}
          SIVA_WEBSITE_WHATSAPP_NUMBER: ${{ secrets.SIVA_WEBSITE_WHATSAPP_NUMBER }}