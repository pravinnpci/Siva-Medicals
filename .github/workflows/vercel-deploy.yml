name: Deploy Siva Medicals to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel Project Configuration
        run: |
          mkdir -p .vercel
          cat << 'EOF' > .vercel/project.json
          {
            "orgId": "${{ secrets.SIVA_VERCEL_ORG_ID || secrets.VERCEL_ORG_ID || 'team_3hlRASIx1p3qCFTRNKRJ2wgu' }}",
            "projectId": "${{ secrets.SIVA_VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID || 'prj_jF7F02TIrbzZD8zNfezoEpPtFGQa' }}"
          }
          EOF

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.SIVA_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.SIVA_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.SIVA_VERCEL_TOKEN || secrets.VERCEL_TOKEN }}