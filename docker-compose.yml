services:
  db:
    image: postgres:15-alpine
    container_name: siva_db
    restart: always
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    ports:
      - "5432:5432"
    volumes:
      - ./backend/node_modules/connect-pg-simple/table.sql:/docker-entrypoint-initdb.d/10-session.sql:ro
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    image: pravinnpci/siva-medicals:latest
    container_name: siva_backend
    restart: always
    environment:
      SIVA_DATABASE_URL: 
      SIVA_SUPABASE_URL: 
      SIVA_SUPABASE_ANON_KEY: 
      SIVA_SESSION_SECRET: 
      SIVA_TWILIO_ACCOUNT_SID: 
      SIVA_TWILIO_AUTH_TOKEN: 
      SIVA_TWILIO_WHATSAPP_NUMBER: 
      SIVA_WEBSITE_WHATSAPP_NUMBER: 
      SIVA_COMPANY_EMAIL: 
      SIVA_PORT: 3001
      SIVA_NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./backend/views:/app/views
      - ./backend/public:/app/public
      - ./frontend/images:/app/images
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    image: pravinnpci/siva-frontend:latest
    container_name: siva_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: